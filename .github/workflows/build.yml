name: Build
run-name: OpenSekai ${{ github.ref_name }}

# Builds every platform with OpenSekai.Editor.PlayerBuilds (the same code as the OpenSekai/Build menu).
# Run it by hand from the Actions tab, or push a v* tag to also publish a GitHub release.
# Needs the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets (see game-ci's activation docs).
# Android is signed with ANDROID_KEYSTORE_BASE64 / _PASS / ANDROID_KEYALIAS_NAME / _PASS when set,
# otherwise with Unity's debug key. The iOS job exports an unsigned Xcode project.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  BUILD_NAME: OpenSekai
  BUILDS_PATH: build

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      display: ${{ steps.v.outputs.display }}
      android_code: ${{ steps.v.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version: Player Settings / tag version; display: file names and the shipped version string.
      - id: v
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Release tags must look like v1.2 or v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
          else
            VERSION=$(grep -m1 'bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          {
            echo "version=$VERSION"
            echo "display=${VERSION}-${BUILD_NUMBER}"
            echo "android_code=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: StandaloneWindows64
            method: OpenSekai.Editor.PlayerBuilds.BuildWindows
          - name: macOS
            platform: StandaloneOSX
            method: OpenSekai.Editor.PlayerBuilds.BuildMacOS
          - name: Linux
            platform: StandaloneLinux64
            method: OpenSekai.Editor.PlayerBuilds.BuildLinux
          - name: Android
            platform: Android
            method: OpenSekai.Editor.PlayerBuilds.BuildAndroid
    env:
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
    steps:
      # The Unity editor image plus the Library cache barely fit on a hosted runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive # ManagedBass
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.platform }}-

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.method }}
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ needs.version.outputs.display }}
          androidVersionCode: ${{ needs.version.outputs.android_code }}
          androidExportType: androidPackage
          androidKeystoreName: opensekai.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Package
        run: |
          set -euo pipefail
          sudo chown -R "$USER" "$BUILDS_PATH"
          mkdir -p out
          DIR="$BUILDS_PATH/${{ matrix.platform }}"
          case "${{ matrix.platform }}" in
            Android)
              cp "$DIR/$BUILD_NAME.apk" "out/$BUILD_NAME-$DISPLAY_VERSION-Android.apk" ;;
            StandaloneOSX)
              # Keep the app bundle's executable permissions and symbolic links.
              (cd "$DIR" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-$DISPLAY_VERSION-macOS-universal.zip" "$BUILD_NAME.app") ;;
            *)
              # Ship the whole folder: the player needs its _Data directory and the BASS libraries.
              NAME="${{ matrix.name }}"
              (cd "$DIR" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-$DISPLAY_VERSION-$NAME-x64.zip" . \
                -x '*_BurstDebugInformation_DoNotShip/*' '*_BackUpThisFolder_ButDontShipItWithYourGame/*') ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # Unity exports the Xcode project; sign and archive it in Xcode (or add fastlane here).
  ios:
    name: Build (iOS Xcode project)
    runs-on: macos-latest
    timeout-minutes: 120
    needs: [version]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-iOS-

      # CFBundleShortVersionString must be plain dotted numbers, so iOS takes the bare version;
      # the build number (CFBundleVersion) is the commit count, set by IosBuildPostprocess.
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          buildMethod: OpenSekai.Editor.PlayerBuilds.BuildIOS
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ needs.version.outputs.version }}

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          (cd "$BUILDS_PATH/iOS" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-${{ needs.version.outputs.display }}-iOS-xcode.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: out-iOS
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: collected
          merge-multiple: true

      - run: |
          gh release create "$GITHUB_REF_NAME" collected/* --verify-tag \
            --title "OpenSekai ${{ needs.version.outputs.display }}" --generate-notes

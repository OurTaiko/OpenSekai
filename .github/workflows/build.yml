name: Build
run-name: OpenSekai ${{ github.ref_name }}

# Builds every platform with OpenSekai.Editor.PlayerBuilds (the same code as the OpenSekai/Build menu).
# Run it by hand from the Actions tab, or push a v* tag to also publish a GitHub release.
# Needs the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets (see game-ci's activation docs).
# Android is signed with ANDROID_KEYSTORE_BASE64 / _PASS / ANDROID_KEYALIAS_NAME / _PASS when set,
# otherwise with Unity's debug key. The iOS job also supports opt-in TestFlight uploads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Sign and upload iOS to TestFlight
        type: boolean
        default: false
      ios_only:
        description: Skip desktop and Android builds
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  BUILD_NAME: OpenSekai
  BUILDS_PATH: build

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      display: ${{ steps.v.outputs.display }}
      android_code: ${{ steps.v.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version: Player Settings / tag version; display: file names and the shipped version string.
      - id: v
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Release tags must look like v1.2 or v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
          else
            VERSION=$(grep -m1 'bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          {
            echo "version=$VERSION"
            echo "display=${VERSION}-${BUILD_NUMBER}"
            echo "android_code=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.ios_only
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: StandaloneWindows64
            method: OpenSekai.Editor.PlayerBuilds.BuildWindows
          - name: macOS
            platform: StandaloneOSX
            method: OpenSekai.Editor.PlayerBuilds.BuildMacOS
          - name: Linux
            platform: StandaloneLinux64
            method: OpenSekai.Editor.PlayerBuilds.BuildLinux
          - name: Android
            platform: Android
            method: OpenSekai.Editor.PlayerBuilds.BuildAndroid
    env:
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
    steps:
      # The Unity editor image plus the Library cache barely fit on a hosted runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive # ManagedBass
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.platform }}-

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.method }}
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ needs.version.outputs.display }}
          androidVersionCode: ${{ needs.version.outputs.android_code }}
          androidExportType: androidPackage
          androidKeystoreName: opensekai.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Package
        run: |
          set -euo pipefail
          sudo chown -R "$USER" "$BUILDS_PATH"
          mkdir -p out
          DIR="$BUILDS_PATH/${{ matrix.platform }}"
          case "${{ matrix.platform }}" in
            Android)
              cp "$DIR/$BUILD_NAME.apk" "out/$BUILD_NAME-$DISPLAY_VERSION-Android.apk" ;;
            StandaloneOSX)
              # Keep the app bundle's executable permissions and symbolic links.
              (cd "$DIR" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-$DISPLAY_VERSION-macOS-universal.zip" "$BUILD_NAME.app") ;;
            *)
              # Ship the whole folder: the player needs its _Data directory and the BASS libraries.
              NAME="${{ matrix.name }}"
              (cd "$DIR" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-$DISPLAY_VERSION-$NAME-x64.zip" . \
                -x '*_BurstDebugInformation_DoNotShip/*' '*_BackUpThisFolder_ButDontShipItWithYourGame/*') ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # Keep the Xcode export available for existing release and manual builds.
  ios:
    name: Build (iOS Xcode project)
    env:
      UPLOAD_TESTFLIGHT: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_testflight) || (startsWith(github.ref, 'refs/tags/v') && vars.TESTFLIGHT_ENABLED == 'true') }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_PROFILE_NAME: ${{ secrets.APPSTORE_PROFILE_NAME }}
      BUNDLE_ID: com.sparkbarry.sekai
      EXPORT_DIR: ${{ github.workspace }}/build/iOS
      IPA_DIR: ${{ github.workspace }}/build/ipa
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    runs-on: macos-26
    timeout-minutes: 120
    needs: [version]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check signing configuration
        if: env.UPLOAD_TESTFLIGHT == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for key in APPLE_TEAM_ID APPSTORE_PROFILE_NAME CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing iOS signing configuration: $key"
              exit 1
            fi
          done

      - name: Import the Apple Distribution certificate
        if: env.UPLOAD_TESTFLIGHT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-iOS-

      # CFBundleShortVersionString must be plain dotted numbers, so iOS takes the bare version;
      # the build number (CFBundleVersion) is the commit count, set by IosBuildPostprocess.
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          buildMethod: OpenSekai.Editor.PlayerBuilds.BuildIOS
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ needs.version.outputs.version }}

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          (cd "$BUILDS_PATH/iOS" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-${{ needs.version.outputs.display }}-iOS-xcode.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: out-iOS
          path: out/*
          if-no-files-found: error
          retention-days: 7

      - name: Locate the Xcode project
        if: env.UPLOAD_TESTFLIGHT == 'true'
        id: xcode
        run: |
          set -euo pipefail
          PROJECT=$(find "$EXPORT_DIR" -maxdepth 2 -type d -name OpenSekai.xcodeproj -print)
          if [[ ! -d "$PROJECT" ]]; then
            echo "::error::Expected one OpenSekai.xcodeproj under the Unity iOS export"
            exit 1
          fi
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Project $PROJECT, scheme $SCHEME"

      - name: Install the App Store provisioning profile
        if: env.UPLOAD_TESTFLIGHT == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$DIR/appstore.mobileprovision"
          security cms -D -i "$DIR/appstore.mobileprovision" | plutil -extract Name raw -

      - uses: ruby/setup-ruby@v1
        if: env.UPLOAD_TESTFLIGHT == 'true'
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        if: env.UPLOAD_TESTFLIGHT == 'true'
        run: bundle install

      - name: Sign and build the IPA
        if: env.UPLOAD_TESTFLIGHT == 'true'
        env:
          IOS_PROJECT_PATH: ${{ steps.xcode.outputs.project }}
          IOS_SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          mkdir -p "$IPA_DIR"
          bundle exec fastlane ios build

      - name: Show the IPA's identity and version
        if: env.UPLOAD_TESTFLIGHT == 'true'
        id: ipa
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$IPA_DIR/OpenSekai.ipa" -d "$TMP"
          PLIST=$(ls -d "$TMP"/Payload/*.app | head -n 1)/Info.plist
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
            printf '%s: ' "$key"; /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST"
          done
          ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          [[ "$ID" == "$BUNDLE_ID" && "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ && "$NUMBER" =~ ^[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: env.UPLOAD_TESTFLIGHT == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.ipa.outputs.version }}
          BUILD_NUMBER: ${{ steps.ipa.outputs.number }}
        run: |
          set -euo pipefail
          bundle exec fastlane ios deliver_beta

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: collected
          merge-multiple: true

      - run: |
          gh release create "$GITHUB_REF_NAME" collected/* --verify-tag \
            --title "OpenSekai ${{ needs.version.outputs.display }}" --generate-notes
